{% macro icon(name, class_name="icon") -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "hardware" %}
  <rect x="3" y="3" width="18" height="18" rx="3"/><rect x="8" y="8" width="8" height="8" rx="1"/><path d="M8 1v2m4-2v2m4-2v2M8 21v2m4-2v2m4-2v2M1 8h2m-2 4h2m-2 4h2m18-8h2m-2 4h2m-2 4h2"/>
  {% elif name == "networks" %}
  <circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4m-5.8 6.2 4-5.1m7.6 5.1-4-5.1M8 11h8"/>
  {% elif name == "systems" %}
  <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h.01M12 9h.01M16 9h.01M8 13h8m-8 3h5"/>
  {% elif name == "security" %}
  <rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3"/>
  {% elif name == "check" %}
  <path d="m5 12 4 4L19 6"/>
  {% elif name == "arrow" %}
  <path d="M5 12h14m-6-6 6 6-6 6"/>
  {% elif name == "book" %}
  <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 17a2.5 2.5 0 0 1 2.5-2.5H20M8 7h8m-8 4h6"/>
  {% elif name == "clock" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif name == "shield" %}
  <path d="M12 3 4 7v5c0 5 3.4 8 8 9 4.6-1 8-4 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-4"/>
  {% elif name == "spark" %}
  <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14ZM5 3l.7 1.3L7 5l-1.3.7L5 7l-.7-1.3L3 5l1.3-.7L5 3Z"/>
  {% elif name == "plus" %}
  <path d="M12 5v14m-7-7h14"/>
  {% elif name == "info" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>
  {% elif name == "cart" %}
  <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
  {% elif name == "user" %}
  <circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/>
  {% elif name == "close" %}
  <path d="m18 6-12 12M6 6l12 12"/>
  {% elif name == "minus" %}
  <path d="M5 12h14"/>
  {% elif name == "chat" %}
  <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2 1-4a7.5 7.5 0 1 1 16-5.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/>
  {% elif name == "arrow-left" %}
  <path d="M19 12H5m7 7-7-7 7-7"/>
  {% elif name == "lock" %}
  <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/>
  {% elif name == "support" %}
  <path d="M4 13v-2a8 8 0 0 1 16 0v2"/><path d="M4 13h3v6H6a2 2 0 0 1-2-2v-4Zm16 0h-3v6h1a2 2 0 0 0 2-2v-4ZM12 21h2"/>
  {% endif %}
</svg>
{%- endmacro %}
